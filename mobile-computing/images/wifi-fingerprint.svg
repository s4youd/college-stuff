<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Wi-Fi fingerprinting</title>
  <desc id="desc">Offline phase: survey signal strengths from several access points at known locations to build a radio map. Online phase: compare a live reading with the map to estimate position.</desc>
  <style>
    .bg{fill:#fbf8f1}.card{fill:#fff;stroke:#d8d0c2;stroke-width:1.5}
    .h{font:700 23px system-ui,Segoe UI,Arial,sans-serif;fill:#1d2a2e}
    .t{font:700 14px system-ui,Segoe UI,Arial,sans-serif;fill:#1d2a2e}
    .s{font:400 12.5px system-ui,Segoe UI,Arial,sans-serif;fill:#5f6b6f}
    .mono{font:600 13px Consolas,monospace;fill:#1d2a2e}
    .wall{fill:#f3efe6;stroke:#8b9994;stroke-width:2}
    .ap{fill:#0d6b73}.ring{fill:none;stroke:#0d6b73;stroke-width:1.5;opacity:.4}
    .pt{fill:#b26a00}.pt2{fill:#a33b3b}
    .arrow{stroke:#b26a00;stroke-width:3;fill:none;marker-end:url(#arrowhead)}
    .row{fill:#f7f4ee}.head{fill:#e7f1f2}
  </style>
  <defs><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b26a00"/></marker></defs>
  <rect class="bg" width="980" height="560" rx="18"/>
  <text class="h" x="40" y="45">Wi-Fi fingerprinting: the building’s radio shadow</text>
  <text class="s" x="40" y="70">Fingerprinting does not need perfect geometry. It needs a map of what the radio environment looks like at known places.</text>

  <g transform="translate(40 96)">
    <rect class="card" width="520" height="402" rx="14"/>
    <text class="t" x="18" y="28">1 · Offline survey</text>
    <text class="s" x="18" y="48">Walk the grid. Record RSSI from each AP.</text>
    <rect class="wall" x="24" y="66" width="472" height="286" rx="4"/>
    <line x1="210" y1="66" x2="210" y2="222" stroke="#8b9994" stroke-width="2"/>
    <line x1="210" y1="222" x2="496" y2="222" stroke="#8b9994" stroke-width="2"/>
    <line x1="350" y1="222" x2="350" y2="352" stroke="#8b9994" stroke-width="2"/>

    <g transform="translate(90 118)">
      <circle class="ring" r="38"/><circle class="ring" r="76"/><circle class="ap" r="8"/>
      <text class="t" x="0" y="-22" text-anchor="middle">AP1</text>
    </g>
    <g transform="translate(280 126)">
      <circle class="ring" r="38"/><circle class="ring" r="76"/><circle class="ap" r="8"/>
      <text class="t" x="0" y="-22" text-anchor="middle">AP2</text>
    </g>
    <g transform="translate(420 292)">
      <circle class="ring" r="38"/><circle class="ring" r="76"/><circle class="ap" r="8"/>
      <text class="t" x="0" y="-22" text-anchor="middle">AP3</text>
    </g>

    <g class="pt"><circle cx="130" cy="270" r="7"/><text class="mono" x="142" y="275">A</text></g>
    <g class="pt"><circle cx="300" cy="170" r="7"/><text class="mono" x="312" y="175">B</text></g>
    <g class="pt"><circle cx="430" cy="320" r="7"/><text class="mono" x="442" y="325">C</text></g>

    <text class="s" x="24" y="382">Reference points A, B, C become rows in the radio map.</text>
  </g>

  <g transform="translate(584 96)">
    <rect class="card" width="356" height="402" rx="14"/>
    <text class="t" x="18" y="28">2 · Radio map</text>
    <text class="s" x="18" y="48">Each location has a signal signature.</text>
    <rect class="head" x="18" y="66" width="320" height="34" rx="4"/>
    <text class="s" x="30" y="88" font-weight="700">Point</text><text class="s" x="100" y="88" font-weight="700">AP1</text><text class="s" x="170" y="88" font-weight="700">AP2</text><text class="s" x="240" y="88" font-weight="700">AP3</text>
    <rect class="row" x="18" y="104" width="320" height="38" rx="4"/><text class="mono" x="30" y="128">A</text><text class="mono" x="100" y="128">−48</text><text class="mono" x="170" y="128">−67</text><text class="mono" x="240" y="128">−80</text>
    <rect class="row" x="18" y="146" width="320" height="38" rx="4"/><text class="mono" x="30" y="170">B</text><text class="mono" x="100" y="170">−72</text><text class="mono" x="170" y="170">−51</text><text class="mono" x="240" y="170">−74</text>
    <rect class="row" x="18" y="188" width="320" height="38" rx="4"/><text class="mono" x="30" y="212">C</text><text class="mono" x="100" y="212">−83</text><text class="mono" x="170" y="212">−69</text><text class="mono" x="240" y="212">−50</text>
    <text class="s" x="18" y="258">dBm values are illustrative, not universal.</text>

    <path class="arrow" d="M130 286 C 130 320, 230 320, 230 350"/>
    <rect x="18" y="300" width="320" height="84" rx="10" fill="#f6eee3" stroke="#d8b98f"/>
    <text class="t" x="32" y="326">3 · Online match</text>
    <text class="s" x="32" y="347">Live reading: [−49, −66, −79]</text>
    <text class="s" x="32" y="367">Closest fingerprint → nearest reference point.</text>
  </g>

  <text class="s" x="40" y="530">Practical cost: surveying is slow, and the map goes stale when APs move, walls change, or crowds alter the radio environment.</text>
</svg>
