<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">GPS trilateration</title>
  <desc id="desc">Four satellites each give a range. Each range is a sphere around one satellite. Three spheres narrow the position to two points; a fourth resolves the receiver clock bias and selects one point.</desc>
  <style>
    .bg{fill:#0e1820}
    .panel{fill:#13232e;stroke:#2c4652;stroke-width:1.5}
    .h{font:700 24px system-ui,Segoe UI,Arial,sans-serif;fill:#eaf2f4}
    .s{font:400 13px system-ui,Segoe UI,Arial,sans-serif;fill:#a9bcc4}
    .sat{fill:#d7e7ec;stroke:#8fb3bf;stroke-width:2}
    .wing{fill:#7aa2f7}
    .wing2{fill:#9ece6a}
    .range{fill:none;stroke-width:2;stroke-dasharray:6 6}
    .r1{stroke:#7aa2f7}.r2{stroke:#9ece6a}.r3{stroke:#e0af68}.r4{stroke:#c792ea}
    .point{fill:#f7768e;stroke:#fff;stroke-width:2}
    .halo{fill:none;stroke:#f7768e;stroke-width:1.4;opacity:.5}
    .label{font:600 13px system-ui,Segoe UI,Arial,sans-serif;fill:#eaf2f4}
    .mono{font:600 14px Consolas,monospace;fill:#eaf2f4}
  </style>
  <defs>
    <clipPath id="panelClip">
      <rect x="35" y="101" width="890" height="298" rx="15"/>
    </clipPath>
  </defs>

  <rect class="bg" width="960" height="640" rx="18"/>
  <text class="h" x="40" y="46">GPS: four ranges, one you</text>
  <text class="s" x="40" y="74">Each satellite timestamps its signal; the receiver measures when it arrived.</text>

  <rect class="panel" x="34" y="100" width="892" height="300" rx="16"/>

  <g clip-path="url(#panelClip)">
    <circle class="range r1" cx="185" cy="160" r="436"/>
    <circle class="range r2" cx="415" cy="145" r="264"/>
    <circle class="range r3" cx="665" cy="160" r="215"/>
    <circle class="range r4" cx="800" cy="265" r="242"/>

    <g transform="translate(185 160)">
      <rect class="sat" x="-22" y="-13" width="44" height="26" rx="4"/>
      <rect class="wing" x="-48" y="-16" width="20" height="32" rx="2"/>
      <rect class="wing" x="28" y="-16" width="20" height="32" rx="2"/>
    </g>
    <g transform="translate(415 145)">
      <rect class="sat" x="-22" y="-13" width="44" height="26" rx="4"/>
      <rect class="wing2" x="-48" y="-16" width="20" height="32" rx="2"/>
      <rect class="wing2" x="28" y="-16" width="20" height="32" rx="2"/>
    </g>
    <g transform="translate(665 160)">
      <rect class="sat" x="-22" y="-13" width="44" height="26" rx="4"/>
      <rect class="wing" x="-48" y="-16" width="20" height="32" rx="2"/>
      <rect class="wing" x="28" y="-16" width="20" height="32" rx="2"/>
    </g>
    <g transform="translate(800 265)">
      <rect class="sat" x="-22" y="-13" width="44" height="26" rx="4"/>
      <rect class="wing2" x="-48" y="-16" width="20" height="32" rx="2"/>
      <rect class="wing2" x="28" y="-16" width="20" height="32" rx="2"/>
    </g>

    <text class="label" x="185" y="198" text-anchor="middle">S1</text>
    <text class="label" x="415" y="183" text-anchor="middle">S2</text>
    <text class="label" x="665" y="198" text-anchor="middle">S3</text>
    <text class="label" x="800" y="303" text-anchor="middle">S4</text>

    <circle class="halo" cx="575" cy="355" r="17"/>
    <circle class="point" cx="575" cy="355" r="8"/>
    <text class="label" x="575" y="384" text-anchor="middle">receiver</text>
  </g>

  <text class="s" x="40" y="436">Each measured range is a sphere around one satellite.</text>
  <text class="s" x="40" y="458">Three spheres intersect at two candidate points.</text>
  <text class="s" x="40" y="480">The fourth resolves the clock bias and picks one of them.</text>
  <text class="mono" x="40" y="510">ρᵢ = c · (t_rx − t_tx,i)</text>
  <text class="s" x="40" y="540">GPS is a timing system that happens to know where you are.</text>
  <text class="s" x="40" y="562">A 1 ms clock error is about 300 km of range error.</text>
  <text class="s" x="40" y="590" fill="#e0af68">Exam trap: three satellites give a 2D fix only if altitude is known.</text>
  <text class="s" x="40" y="614">The receiver is passive: it listens; the satellites broadcast.</text>
</svg>
