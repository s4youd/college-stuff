<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" fill="none">
  <defs>
    <pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#5eead4" stroke-opacity=".05"/>
    </pattern>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0l6 3-6 3z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="900" height="470" rx="18" fill="#05080f"/>
  <rect width="900" height="470" rx="18" fill="url(#g)"/>
  <text x="46" y="46" fill="#5c6b84" font-family="monospace" font-size="10" letter-spacing="3">THE TENSORFLOW LOOP · CREATE → COMPILE → FIT → EVALUATE</text>

  <g font-family="monospace">
    <!-- create -->
    <rect x="48" y="96" width="180" height="126" rx="12" fill="#071019" stroke="#5eead4" stroke-opacity=".5"/>
    <text x="68" y="124" fill="#5eead4" font-size="10" letter-spacing="2">01 · CREATE</text>
    <text x="68" y="150" fill="#e7ecf5" font-size="13">Sequential API</text>
    <text x="68" y="172" fill="#93a1b8" font-size="9">stack layers:</text>
    <text x="68" y="190" fill="#93a1b8" font-size="9">Dense(units, activation)</text>
    <text x="68" y="208" fill="#5c6b84" font-size="8">architecture = capacity</text>

    <!-- compile -->
    <rect x="260" y="96" width="180" height="126" rx="12" fill="#071019" stroke="#22d3ee" stroke-opacity=".5"/>
    <text x="280" y="124" fill="#22d3ee" font-size="10" letter-spacing="2">02 · COMPILE</text>
    <text x="280" y="150" fill="#e7ecf5" font-size="13">loss + optimizer</text>
    <text x="280" y="172" fill="#93a1b8" font-size="9">loss = error to minimise</text>
    <text x="280" y="190" fill="#93a1b8" font-size="9">optimizer = update rule</text>
    <text x="280" y="208" fill="#5c6b84" font-size="8">metrics = what you report</text>

    <!-- fit -->
    <rect x="472" y="96" width="180" height="126" rx="12" fill="#071019" stroke="#a78bfa" stroke-opacity=".5"/>
    <text x="492" y="124" fill="#a78bfa" font-size="10" letter-spacing="2">03 · FIT</text>
    <text x="492" y="150" fill="#e7ecf5" font-size="13">model.fit(X, y)</text>
    <text x="492" y="172" fill="#93a1b8" font-size="9">epochs · batch size</text>
    <text x="492" y="190" fill="#93a1b8" font-size="9">learn weights from data</text>
    <text x="492" y="208" fill="#5c6b84" font-size="8">validation set tunes</text>

    <!-- evaluate -->
    <rect x="684" y="96" width="168" height="126" rx="12" fill="#071019" stroke="#f472b6" stroke-opacity=".5"/>
    <text x="704" y="124" fill="#f472b6" font-size="10" letter-spacing="2">04 · EVALUATE</text>
    <text x="704" y="150" fill="#e7ecf5" font-size="13">model.evaluate()</text>
    <text x="704" y="172" fill="#93a1b8" font-size="9">returns loss + metrics</text>
    <text x="704" y="190" fill="#93a1b8" font-size="9">test set stays untouched</text>
    <text x="704" y="208" fill="#5c6b84" font-size="8">then predict on new data</text>
  </g>

  <path d="M228 159h26M440 159h26M652 159h26" stroke="#5eead4" stroke-opacity=".6" marker-end="url(#ar)"/>

  <!-- lower detail -->
  <g font-family="monospace">
    <rect x="48" y="266" width="390" height="150" rx="12" fill="#071019" stroke="#fbbf24" stroke-opacity=".3"/>
    <text x="68" y="294" fill="#fbbf24" font-size="10" letter-spacing="2">LOSS FUNCTIONS</text>
    <text x="68" y="322" fill="#e7ecf5" font-size="11">MAE = average |prediction − truth|</text>
    <text x="68" y="344" fill="#93a1b8" font-size="9">less sensitive to one large error</text>
    <text x="68" y="372" fill="#e7ecf5" font-size="11">MSE = average (prediction − truth)²</text>
    <text x="68" y="394" fill="#93a1b8" font-size="9">punishes larger errors more</text>

    <rect x="462" y="266" width="390" height="150" rx="12" fill="#071019" stroke="#5eead4" stroke-opacity=".3"/>
    <text x="482" y="294" fill="#5eead4" font-size="10" letter-spacing="2">DATA PREP · THE QUIET MARKS</text>
    <text x="482" y="322" fill="#e7ecf5" font-size="11">categorical → one-hot columns</text>
    <text x="482" y="344" fill="#93a1b8" font-size="9">neural networks need numbers</text>
    <text x="482" y="372" fill="#e7ecf5" font-size="11">normalise 0–1 · standardise μ=0, σ=1</text>
    <text x="482" y="394" fill="#93a1b8" font-size="9">scaling makes features comparable</text>
  </g>

  <text x="46" y="450" fill="#5c6b84" font-family="monospace" font-size="9" letter-spacing="2">LOSS IS FOR LEARNING. METRICS ARE FOR REPORTING. DO NOT SWAP THEM.</text>
</svg>
