<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" fill="none">
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#05080f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#5eead4" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="900" height="470" rx="18" fill="#05080f"/>
  <rect width="900" height="470" rx="18" fill="url(#g)"/>
  <ellipse cx="450" cy="250" rx="240" ry="200" fill="url(#glow)"/>
  <text x="46" y="46" fill="#5c6b84" font-family="monospace" font-size="10" letter-spacing="3">THE FIVE Vs · THREE ORIGINAL + TWO ADDED</text>

  <circle cx="450" cy="250" r="112" stroke="#5eead4" stroke-opacity=".24" stroke-dasharray="2 7"/>
  <circle cx="450" cy="250" r="62" fill="#071019" stroke="#5eead4" stroke-opacity=".5"/>
  <text x="450" y="244" text-anchor="middle" fill="#e7ecf5" font-family="monospace" font-size="17" letter-spacing="3">BIG</text>
  <text x="450" y="268" text-anchor="middle" fill="#5eead4" font-family="monospace" font-size="17" letter-spacing="3">DATA</text>

  <!-- spokes -->
  <g stroke="#5eead4" stroke-opacity=".2">
    <path d="M450 138V92M450 362v46M338 250H232M562 250h106M371 171l-52-46M529 329l52 46M529 171l52-46M371 329l-52 46"/>
  </g>

  <!-- volume -->
  <g transform="translate(92 68)">
    <rect width="168" height="58" rx="10" fill="#071019" stroke="#5eead4" stroke-opacity=".5"/>
    <text x="14" y="24" fill="#5eead4" font-family="monospace" font-size="10" letter-spacing="2">VOLUME</text>
    <text x="14" y="43" fill="#93a1b8" font-family="monospace" font-size="9">scale of the data</text>
  </g>
  <!-- velocity -->
  <g transform="translate(640 66)">
    <rect width="168" height="58" rx="10" fill="#071019" stroke="#22d3ee" stroke-opacity=".5"/>
    <text x="14" y="24" fill="#22d3ee" font-family="monospace" font-size="10" letter-spacing="2">VELOCITY</text>
    <text x="14" y="43" fill="#93a1b8" font-family="monospace" font-size="9">speed of arrival</text>
  </g>
  <!-- variety -->
  <g transform="translate(52 330)">
    <rect width="168" height="58" rx="10" fill="#071019" stroke="#a78bfa" stroke-opacity=".5"/>
    <text x="14" y="24" fill="#a78bfa" font-family="monospace" font-size="10" letter-spacing="2">VARIETY</text>
    <text x="14" y="43" fill="#93a1b8" font-family="monospace" font-size="9">structured → raw</text>
  </g>
  <!-- veracity -->
  <g transform="translate(680 330)">
    <rect width="168" height="58" rx="10" fill="#071019" stroke="#f472b6" stroke-opacity=".5"/>
    <text x="14" y="24" fill="#f472b6" font-family="monospace" font-size="10" letter-spacing="2">VERACITY</text>
    <text x="14" y="43" fill="#93a1b8" font-family="monospace" font-size="9">trust / quality</text>
  </g>
  <!-- value -->
  <g transform="translate(366 382)">
    <rect width="168" height="58" rx="10" fill="#071019" stroke="#fbbf24" stroke-opacity=".5"/>
    <text x="14" y="24" fill="#fbbf24" font-family="monospace" font-size="10" letter-spacing="2">VALUE</text>
    <text x="14" y="43" fill="#93a1b8" font-family="monospace" font-size="9">insight worth money</text>
  </g>

  <text x="450" y="452" text-anchor="middle" fill="#5c6b84" font-family="monospace" font-size="9" letter-spacing="2">VALIDATION IS NOT A V. VOLATILITY IS NOT A V. SAY THE FIVE AND STOP.</text>
</svg>
