<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" fill="none">
  <defs>
    <pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#5eead4" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="900" height="470" rx="18" fill="#05080f"/>
  <rect width="900" height="470" rx="18" fill="url(#g)"/>
  <text x="46" y="46" fill="#5c6b84" font-family="monospace" font-size="10" letter-spacing="3">TENSOR ANATOMY · RANK = NUMBER OF DIMENSIONS</text>

  <!-- scalar -->
  <g>
    <rect x="48" y="86" width="180" height="300" rx="14" fill="#071019" stroke="#5eead4" stroke-opacity=".4"/>
    <text x="138" y="116" text-anchor="middle" fill="#5eead4" font-family="monospace" font-size="11" letter-spacing="2">SCALAR</text>
    <text x="138" y="136" text-anchor="middle" fill="#5c6b84" font-family="monospace" font-size="9">rank 0</text>
    <rect x="108" y="182" width="60" height="60" rx="10" fill="#05080f" stroke="#5eead4" stroke-opacity=".7"/>
    <text x="138" y="219" text-anchor="middle" fill="#e7ecf5" font-family="monospace" font-size="18">7</text>
    <text x="138" y="286" text-anchor="middle" fill="#93a1b8" font-family="monospace" font-size="9">shape: ()</text>
    <text x="138" y="306" text-anchor="middle" fill="#93a1b8" font-family="monospace" font-size="9">size: 1</text>
    <text x="138" y="340" text-anchor="middle" fill="#5c6b84" font-family="monospace" font-size="8">a single number</text>
  </g>

  <!-- vector -->
  <g>
    <rect x="248" y="86" width="180" height="300" rx="14" fill="#071019" stroke="#22d3ee" stroke-opacity=".4"/>
    <text x="338" y="116" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="11" letter-spacing="2">VECTOR</text>
    <text x="338" y="136" text-anchor="middle" fill="#5c6b84" font-family="monospace" font-size="9">rank 1</text>
    <g>
      <rect x="286" y="178" width="34" height="34" rx="5" fill="#05080f" stroke="#22d3ee" stroke-opacity=".7"/>
      <rect x="322" y="178" width="34" height="34" rx="5" fill="#05080f" stroke="#22d3ee" stroke-opacity=".7"/>
      <rect x="358" y="178" width="34" height="34" rx="5" fill="#05080f" stroke="#22d3ee" stroke-opacity=".7"/>
      <text x="303" y="200" text-anchor="middle" fill="#e7ecf5" font-family="monospace" font-size="11">1</text>
      <text x="339" y="200" text-anchor="middle" fill="#e7ecf5" font-family="monospace" font-size="11">2</text>
      <text x="375" y="200" text-anchor="middle" fill="#e7ecf5" font-family="monospace" font-size="11">3</text>
    </g>
    <text x="338" y="286" text-anchor="middle" fill="#93a1b8" font-family="monospace" font-size="9">shape: (3,)</text>
    <text x="338" y="306" text-anchor="middle" fill="#93a1b8" font-family="monospace" font-size="9">size: 3</text>
    <text x="338" y="340" text-anchor="middle" fill="#5c6b84" font-family="monospace" font-size="8">a list of numbers</text>
  </g>

  <!-- matrix -->
  <g>
    <rect x="448" y="86" width="180" height="300" rx="14" fill="#071019" stroke="#a78bfa" stroke-opacity=".4"/>
    <text x="538" y="116" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="11" letter-spacing="2">MATRIX</text>
    <text x="538" y="136" text-anchor="middle" fill="#5c6b84" font-family="monospace" font-size="9">rank 2</text>
    <g>
      <rect x="492" y="168" width="26" height="26" rx="4" fill="#05080f" stroke="#a78bfa" stroke-opacity=".7"/>
      <rect x="520" y="168" width="26" height="26" rx="4" fill="#05080f" stroke="#a78bfa" stroke-opacity=".7"/>
      <rect x="548" y="168" width="26" height="26" rx="4" fill="#05080f" stroke="#a78bfa" stroke-opacity=".7"/>
      <rect x="492" y="196" width="26" height="26" rx="4" fill="#05080f" stroke="#a78bfa" stroke-opacity=".7"/>
      <rect x="520" y="196" width="26" height="26" rx="4" fill="#05080f" stroke="#a78bfa" stroke-opacity=".7"/>
      <rect x="548" y="196" width="26" height="26" rx="4" fill="#05080f" stroke="#a78bfa" stroke-opacity=".7"/>
      <rect x="492" y="224" width="26" height="26" rx="4" fill="#05080f" stroke="#a78bfa" stroke-opacity=".7"/>
      <rect x="520" y="224" width="26" height="26" rx="4" fill="#05080f" stroke="#a78bfa" stroke-opacity=".7"/>
      <rect x="548" y="224" width="26" height="26" rx="4" fill="#05080f" stroke="#a78bfa" stroke-opacity=".7"/>
    </g>
    <text x="538" y="286" text-anchor="middle" fill="#93a1b8" font-family="monospace" font-size="9">shape: (3, 3)</text>
    <text x="538" y="306" text-anchor="middle" fill="#93a1b8" font-family="monospace" font-size="9">size: 9</text>
    <text x="538" y="340" text-anchor="middle" fill="#5c6b84" font-family="monospace" font-size="8">rows × columns</text>
  </g>

  <!-- 3d -->
  <g>
    <rect x="648" y="86" width="204" height="300" rx="14" fill="#071019" stroke="#f472b6" stroke-opacity=".4"/>
    <text x="750" y="116" text-anchor="middle" fill="#f472b6" font-family="monospace" font-size="11" letter-spacing="2">TENSOR</text>
    <text x="750" y="136" text-anchor="middle" fill="#5c6b84" font-family="monospace" font-size="9">rank 3+</text>
    <g>
      <path d="M700 190l52-26 52 26-52 26z" fill="#05080f" stroke="#f472b6" stroke-opacity=".7"/>
      <path d="M700 190v56l52 26v-56z" fill="#05080f" stroke="#f472b6" stroke-opacity=".5"/>
      <path d="M804 190v56l-52 26v-56z" fill="#05080f" stroke="#f472b6" stroke-opacity=".5"/>
      <path d="M716 190l52-26M716 214l52-26M716 238l52-26" stroke="#f472b6" stroke-opacity=".28"/>
    </g>
    <text x="750" y="300" text-anchor="middle" fill="#93a1b8" font-family="monospace" font-size="9">shape: (d0, d1, d2)</text>
    <text x="750" y="320" text-anchor="middle" fill="#93a1b8" font-family="monospace" font-size="9">size: d0 × d1 × d2</text>
    <text x="750" y="350" text-anchor="middle" fill="#5c6b84" font-family="monospace" font-size="8">e.g. image (H, W, C)</text>
  </g>

  <text x="46" y="444" fill="#5c6b84" font-family="monospace" font-size="9" letter-spacing="2">RANK IS NOT SIZE. A RANK-3 TENSOR CAN HOLD THOUSANDS OF NUMBERS.</text>
</svg>
