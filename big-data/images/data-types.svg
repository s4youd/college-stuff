<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" fill="none">
  <defs>
    <pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#5eead4" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="900" height="470" rx="18" fill="#05080f"/>
  <rect width="900" height="470" rx="18" fill="url(#g)"/>
  <text x="46" y="46" fill="#5c6b84" font-family="monospace" font-size="10" letter-spacing="3">THREE SHAPES OF DATA · THREE LEVELS OF SCHEMA</text>

  <!-- structured -->
  <g>
    <rect x="46" y="76" width="250" height="330" rx="14" fill="#071019" stroke="#5eead4" stroke-opacity=".42"/>
    <text x="66" y="104" fill="#5eead4" font-family="monospace" font-size="11" letter-spacing="2">STRUCTURED</text>
    <text x="66" y="124" fill="#5c6b84" font-family="monospace" font-size="9">fixed schema · rows + columns</text>
    <g stroke="#5eead4" stroke-opacity=".35">
      <rect x="66" y="144" width="210" height="132" rx="6" fill="#05080f"/>
      <path d="M66 178h210M66 210h210M66 242h210M136 144v132"/>
    </g>
    <g fill="#93a1b8" font-family="monospace" font-size="9">
      <text x="78" y="164">id</text><text x="148" y="164">value</text>
      <text x="78" y="196">01</text><text x="148" y="196">42.7</text>
      <text x="78" y="228">02</text><text x="148" y="228">38.1</text>
      <text x="78" y="260">03</text><text x="148" y="260">51.0</text>
    </g>
    <text x="66" y="306" fill="#b7c3d6" font-family="monospace" font-size="9">RDBMS · SQL · spreadsheets</text>
    <text x="66" y="330" fill="#5c6b84" font-family="monospace" font-size="9">easy to query</text>
    <text x="66" y="354" fill="#5c6b84" font-family="monospace" font-size="9">rigid when data changes</text>
  </g>

  <!-- semi -->
  <g>
    <rect x="325" y="76" width="250" height="330" rx="14" fill="#071019" stroke="#a78bfa" stroke-opacity=".42"/>
    <text x="345" y="104" fill="#a78bfa" font-family="monospace" font-size="11" letter-spacing="2">SEMI-STRUCTURED</text>
    <text x="345" y="124" fill="#5c6b84" font-family="monospace" font-size="9">schema travels in tags / keys</text>
    <rect x="345" y="144" width="210" height="132" rx="6" fill="#05080f" stroke="#a78bfa" stroke-opacity=".3"/>
    <g fill="#93a1b8" font-family="monospace" font-size="9">
      <text x="357" y="166">{</text>
      <text x="369" y="184">"user": "sara",</text>
      <text x="369" y="202">"device": {</text>
      <text x="381" y="220">"os": "Android",</text>
      <text x="381" y="238">"ver": 14</text>
      <text x="369" y="256">}</text>
      <text x="357" y="274">}</text>
    </g>
    <text x="345" y="306" fill="#b7c3d6" font-family="monospace" font-size="9">JSON · XML · logs · YAML</text>
    <text x="345" y="330" fill="#5c6b84" font-family="monospace" font-size="9">flexible, self-describing</text>
    <text x="345" y="354" fill="#5c6b84" font-family="monospace" font-size="9">needs parsing / flattening</text>
  </g>

  <!-- unstructured -->
  <g>
    <rect x="604" y="76" width="250" height="330" rx="14" fill="#071019" stroke="#f472b6" stroke-opacity=".42"/>
    <text x="624" y="104" fill="#f472b6" font-family="monospace" font-size="11" letter-spacing="2">UNSTRUCTURED</text>
    <text x="624" y="124" fill="#5c6b84" font-family="monospace" font-size="9">no predefined schema</text>
    <g>
      <rect x="624" y="144" width="96" height="62" rx="6" fill="#05080f" stroke="#f472b6" stroke-opacity=".3"/>
      <path d="M638 188l14-18 12 13 10-11 18 16" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.4"/>
      <circle cx="648" cy="160" r="4" fill="#fbbf24" fill-opacity=".8"/>
      <rect x="732" y="144" width="102" height="62" rx="6" fill="#05080f" stroke="#f472b6" stroke-opacity=".3"/>
      <path d="M748 156h70M748 170h54M748 184h64M748 198h38" stroke="#f472b6" stroke-opacity=".5"/>
      <rect x="624" y="216" width="210" height="60" rx="6" fill="#05080f" stroke="#f472b6" stroke-opacity=".3"/>
      <path d="M640 246c14-18 24 14 38-4s24 16 38-2 24 12 38-4 24 14 38-2 18 10 30 0" stroke="#a78bfa" stroke-opacity=".7" stroke-width="1.2"/>
    </g>
    <text x="624" y="306" fill="#b7c3d6" font-family="monospace" font-size="9">text · images · audio · video</text>
    <text x="624" y="330" fill="#5c6b84" font-family="monospace" font-size="9">NLP + computer vision</text>
    <text x="624" y="354" fill="#5c6b84" font-family="monospace" font-size="9">not directly queryable by SQL</text>
  </g>

  <text x="46" y="444" fill="#5c6b84" font-family="monospace" font-size="9" letter-spacing="2">THE MORE STRUCTURE, THE EASIER THE QUERY — AND THE HARDER THE CHANGE.</text>
</svg>
