<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" fill="none">
  <defs>
    <pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#5eead4" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="n" cx=".5" cy=".5" r=".5">
      <stop stop-color="#5eead4"/><stop offset="1" stop-color="#22d3ee"/>
    </radialGradient>
  </defs>
  <rect width="900" height="470" rx="18" fill="#05080f"/>
  <rect width="900" height="470" rx="18" fill="url(#g)"/>
  <text x="46" y="46" fill="#5c6b84" font-family="monospace" font-size="10" letter-spacing="3">A NEURAL NETWORK · INPUT → HIDDEN → OUTPUT</text>

  <!-- connections -->
  <g stroke="#5eead4" stroke-opacity=".18">
    <!-- input to hidden1 -->
    <path d="M176 130l150 60M176 130l150 150M176 130l150 240M176 230l150-40M176 230l150 60M176 230l150 150M176 330l150-140M176 330l150-40M176 330l150 60"/>
    <!-- hidden1 to hidden2 -->
    <path d="M386 190l120-50M386 190l120 60M386 190l120 170M386 280l120-140M386 280l120-50M386 280l120 60M386 370l120-230M386 370l120-140M386 370l120-50"/>
    <!-- hidden2 to output -->
    <path d="M566 140l140 90M566 250l140-20M566 360l140-130"/>
  </g>

  <!-- input nodes -->
  <g>
    <circle cx="150" cy="130" r="17" fill="#071019" stroke="#5eead4" stroke-opacity=".8"/>
    <circle cx="150" cy="230" r="17" fill="#071019" stroke="#5eead4" stroke-opacity=".8"/>
    <circle cx="150" cy="330" r="17" fill="#071019" stroke="#5eead4" stroke-opacity=".8"/>
    <text x="150" y="136" text-anchor="middle" fill="#5eead4" font-family="monospace" font-size="10">x1</text>
    <text x="150" y="236" text-anchor="middle" fill="#5eead4" font-family="monospace" font-size="10">x2</text>
    <text x="150" y="336" text-anchor="middle" fill="#5eead4" font-family="monospace" font-size="10">x3</text>
    <text x="150" y="378" text-anchor="middle" fill="#93a1b8" font-family="monospace" font-size="9">INPUT LAYER</text>
    <text x="150" y="394" text-anchor="middle" fill="#5c6b84" font-family="monospace" font-size="8">receives the data</text>
  </g>

  <!-- hidden 1 -->
  <g>
    <circle cx="360" cy="190" r="17" fill="#071019" stroke="#a78bfa" stroke-opacity=".8"/>
    <circle cx="360" cy="280" r="17" fill="#071019" stroke="#a78bfa" stroke-opacity=".8"/>
    <circle cx="360" cy="370" r="17" fill="#071019" stroke="#a78bfa" stroke-opacity=".8"/>
    <text x="360" y="196" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10">h1</text>
    <text x="360" y="286" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10">h2</text>
    <text x="360" y="376" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10">h3</text>
    <text x="360" y="414" text-anchor="middle" fill="#93a1b8" font-family="monospace" font-size="9">HIDDEN LAYERS</text>
    <text x="360" y="430" text-anchor="middle" fill="#5c6b84" font-family="monospace" font-size="8">learn patterns / representations</text>
  </g>

  <!-- hidden 2 -->
  <g>
    <circle cx="540" cy="140" r="17" fill="#071019" stroke="#f472b6" stroke-opacity=".8"/>
    <circle cx="540" cy="250" r="17" fill="#071019" stroke="#f472b6" stroke-opacity=".8"/>
    <circle cx="540" cy="360" r="17" fill="#071019" stroke="#f472b6" stroke-opacity=".8"/>
    <text x="540" y="146" text-anchor="middle" fill="#f472b6" font-family="monospace" font-size="10">h4</text>
    <text x="540" y="256" text-anchor="middle" fill="#f472b6" font-family="monospace" font-size="10">h5</text>
    <text x="540" y="366" text-anchor="middle" fill="#f472b6" font-family="monospace" font-size="10">h6</text>
  </g>

  <!-- output -->
  <g>
    <circle cx="720" cy="230" r="22" fill="#071019" stroke="#fbbf24" stroke-opacity=".9"/>
    <text x="720" y="236" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="10">ŷ</text>
    <text x="720" y="278" text-anchor="middle" fill="#93a1b8" font-family="monospace" font-size="9">OUTPUT LAYER</text>
    <text x="720" y="294" text-anchor="middle" fill="#5c6b84" font-family="monospace" font-size="8">probability / prediction</text>
  </g>

  <g font-family="monospace">
    <rect x="648" y="330" width="210" height="72" rx="10" fill="#071019" stroke="#5eead4" stroke-opacity=".25"/>
    <text x="664" y="354" fill="#5eead4" font-size="9" letter-spacing="2">TRAINING LOOP</text>
    <text x="664" y="374" fill="#93a1b8" font-size="9">forward pass → loss → update weights</text>
    <text x="664" y="392" fill="#5c6b84" font-size="8">repeat for many epochs</text>
  </g>
  <text x="46" y="452" fill="#5c6b84" font-family="monospace" font-size="9" letter-spacing="2">DEPTH IS NOT MAGIC. EACH HIDDEN LAYER LEARNS A BETTER REPRESENTATION.</text>
</svg>
